  </defs>

  <rect width="600" height="750" fill="url(#tejalBg)" />
  <rect x="20" y="20" width="560" height="710" rx="8" stroke="#B08D57" stroke-width="2" fill="none" />
  <rect x="28" y="28" width="544" height="694" rx="6" stroke="#D4B886" stroke-width="1" stroke-opacity="0.4" fill="none" />

  <!-- Bride Silhouette Motif -->
